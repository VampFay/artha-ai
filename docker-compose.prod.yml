# ============================================
# Artha AI — Production docker-compose
# Phase 6
#
# Usage:
#   1. Create .env.production (copy from .env.example, fill values)
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. docker compose -f docker-compose.prod.yml logs -f web
# ============================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artha-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # Cloudflare / Caddy terminates TLS
    env_file: .env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://artha:${DB_PASSWORD:-artha}@postgres:5432/artha
      - DIRECT_URL=postgresql://artha:${DB_PASSWORD:-artha}@postgres:5432/artha
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads:/app/uploads   # for local-storage mode; S3 mode doesn't use this
    networks:
      - artha

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artha-worker
    restart: unless-stopped
    command: ["node", "scripts/start-worker.js"]
    env_file: .env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://artha:${DB_PASSWORD:-artha}@postgres:5432/artha
      - WORKER_MODE=true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads   # workers read uploaded files
    networks:
      - artha

  postgres:
    image: postgres:16-alpine
    container_name: artha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artha
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artha}
      POSTGRES_DB: artha
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: mount init scripts (run on first boot only)
      # - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artha -d artha"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Don't expose to host network in prod — only internal
    # expose:
    #   - "5432"
    networks:
      - artha

  redis:
    image: redis:7-alpine
    container_name: artha-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-artha} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-artha}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - artha

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  artha:
    driver: bridge
