<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
   viewBox="0 0 512 512" xml:space="preserve">

<!-- ============================================================ -->
<!--  ARTHA AI — Premium App Icon / Logo                           -->
<!--  512x512 SVG — crisp at 16px to 512px                          -->
<!--  Used as: favicon, app icon, login screen, sidebar            -->
<!-- ============================================================ -->

<defs>
  <style type="text/css">
    .logo-glow {
      animation: logoGlow 3.5s ease-in-out infinite;
    }
    .logo-pulse {
      animation: logoPulse 2.5s ease-in-out infinite;
      transform-origin: 256px 256px;
    }
    .logo-ring {
      animation: logoRing 20s linear infinite;
      transform-origin: 256px 256px;
    }
    .logo-shimmer {
      animation: logoShimmer 4s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes logoPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.93; }
    }
    @keyframes logoRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes logoShimmer {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.25; }
    }
  </style>

  <!-- Primary gradient — saffron to deep amber -->
  <linearGradient id="logo-bg-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fbbf24"/>
    <stop offset="30%" stop-color="#f59e0b"/>
    <stop offset="65%" stop-color="#ea580c"/>
    <stop offset="100%" stop-color="#c2410c"/>
  </linearGradient>

  <!-- Lettermark gradient — white with warm tint -->
  <linearGradient id="logo-letter-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="60%" stop-color="#fff7ed"/>
    <stop offset="100%" stop-color="#fed7aa"/>
  </linearGradient>

  <!-- Top-left shine — adds 3D depth -->
  <linearGradient id="logo-shine-grad" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- Glow halo -->
  <radialGradient id="logo-glow-grad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#fde047" stop-opacity="0.45"/>
    <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>

  <!-- Ring gradient -->
  <linearGradient id="logo-ring-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fbbf24"/>
    <stop offset="50%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#ea580c"/>
  </linearGradient>

  <!-- Drop shadow -->
  <filter id="logo-shadow" x="-15%" y="-15%" width="130%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#9a3412" flood-opacity="0.35"/>
  </filter>

  <!-- Lettermark glow -->
  <filter id="logo-letter-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background glow halo -->
<circle cx="256" cy="256" r="240" fill="url(#logo-glow-grad)" class="logo-glow"/>

<!-- Rotating rings — subtle, elegant -->
<g class="logo-ring">
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#logo-ring-grad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 5"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#logo-ring-grad)" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="3 7"/>
</g>

<!-- Main logo -->
<g class="logo-pulse" filter="url(#logo-shadow)">

  <!-- Rounded square background -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#logo-bg-grad)"/>

  <!-- Inner border for depth -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12"/>

  <!-- Top-left shine — 3D depth -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#logo-shine-grad)"/>

  <!-- Corner accents -->
  <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round" fill="none">
    <path d="M 100 100 L 100 70 M 100 100 L 70 100"/>
    <path d="M 412 100 L 412 70 M 412 100 L 442 100"/>
    <path d="M 100 412 L 100 442 M 100 412 L 70 412"/>
    <path d="M 412 412 L 412 442 M 412 412 L 442 412"/>
  </g>

  <!-- "A" Lettermark -->
  <g filter="url(#logo-letter-glow)">
    <!-- Left stroke -->
    <path d="M 172 372 L 218 372 L 256 140 L 224 140 Z" fill="url(#logo-letter-grad)"/>
    <!-- Right stroke -->
    <path d="M 340 372 L 294 372 L 256 140 L 288 140 Z" fill="url(#logo-letter-grad)"/>
    <!-- Crossbar -->
    <rect x="218" y="280" width="76" height="20" rx="10" fill="url(#logo-letter-grad)"/>
    <!-- Crossbar highlight -->
    <rect x="220" y="282" width="72" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Shimmer overlay -->
  <g class="logo-shimmer">
    <path d="M 192 350 L 238 350 L 268 160 L 240 160 Z" fill="#ffffff"/>
    <path d="M 320 350 L 274 350 L 244 160 L 272 160 Z" fill="#ffffff"/>
    <rect x="218" y="280" width="76" height="20" rx="10" fill="#ffffff"/>
  </g>

  <!-- Top gem accent -->
  <circle cx="256" cy="110" r="10" fill="#ffffff" opacity="0.4" class="logo-glow"/>
  <circle cx="256" cy="110" r="5" fill="#ffffff" opacity="0.85" class="logo-glow"/>

  <!-- Bottom dots -->
  <circle cx="196" cy="405" r="5" fill="#ffffff" opacity="0.25"/>
  <circle cx="316" cy="405" r="5" fill="#ffffff" opacity="0.25"/>
  <circle cx="256" cy="405" r="3" fill="#ffffff" opacity="0.15"/>

</g>
</svg>
